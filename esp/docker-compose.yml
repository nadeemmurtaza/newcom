version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: esp_user
      POSTGRES_PASSWORD: esp_password
      POSTGRES_DB: esp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Phase 59: this never actually loaded schema.sql -- a fresh `db`
      # container started with an empty database and nothing creating a
      # single table. Postgres's official image runs every .sql file here
      # once, on first init only.
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esp_user -d esp_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://esp_user:esp_password@db:5432/esp_db?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # Generate with: openssl rand -base64 24 | cut -c1-32
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.nmail.local}
      PORT: "8080"
      SMTP_PORT: "2525"
    ports:
      - "8080:8080" # HTTP API / dashboard
      - "2525:2525" # Inbound SMTP (front with a :25 relay or port-forward in prod)
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
