spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/esp_db}
spring.datasource.username=${DATABASE_USER:esp_user}
spring.datasource.password=${DATABASE_PASSWORD:esp_password}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Phase 11 (main.go): "Java Migration - Campaigns are now handled by
# campaign-service (Port 8082)" -- nmail's HTTP API is 8081, collab-service
# is 8090; 8082 is this service's own reserved port, not a guess.
server.port=${CAMPAIGN_SERVICE_PORT:8082}

# Phase 58: JobLauncher.run() needs Spring Batch's own metadata tables
# (BATCH_JOB_INSTANCE, BATCH_STEP_EXECUTION, etc.) to exist -- nothing in
# this project's schema.sql creates them (they're private to Spring Batch,
# a different concern from the app's own campaigns/contacts tables), and
# Spring Boot 3's default is NEVER create them automatically. Without this,
# every job launch fails immediately with "relation BATCH_JOB_INSTANCE does
# not exist" against a fresh database.
spring.batch.jdbc.initialize-schema=always

# Phase 58: Spring Boot auto-runs any Job bean on startup by default --
# confirmed live: campaignJob ran once at boot with empty parameters
# before CampaignController ever launches it on purpose. Harmless today
# (NULL list_id/campaignId/orgId match nothing), but it's an unintended,
# unparameterized run of the batch job every single time this service
# starts, and relying on "happens to match nothing" is not the same as
# it being disabled. Jobs now only run when CampaignController launches
# them explicitly.
spring.batch.job.enabled=false
